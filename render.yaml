services:
  - type: web
    name: fin-sentiment-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: MODEL_NAME
        value: ProsusAI/finbert
      - key: USE_DEMO_DATA
        value: "false"
      - key: USE_LOCAL_FINBERT
        value: "false"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: CUDA_VISIBLE_DEVICES
        value: ""
      - key: PYTORCH_NO_CUDA_MEMORY_CACHING
        value: "1"
      - key: NEWS_PROVIDER
        value: "auto"
      - key: JWT_SECRET_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        value: "https://market-tracker-umber.vercel.app"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "none"

