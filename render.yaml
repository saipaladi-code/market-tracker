services:
  - type: web
    name: fin-sentiment-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: MODEL_NAME
        value: ProsusAI/finbert
      - key: USE_DEMO_DATA
        value: "false"
