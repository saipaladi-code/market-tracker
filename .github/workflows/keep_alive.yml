name: Keep Render Backend Awake

on:
  schedule:
    # Run every 10 minutes to prevent Render free-tier idle spin-down (15 min inactivity threshold)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Endpoint
        run: |
          curl -s -f -m 30 https://market-tracker-c6ou.onrender.com/health || echo "Ping request executed"

